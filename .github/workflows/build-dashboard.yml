name: Build dashboard

# Manual runs for iterating on the build itself, plus a real release whenever
# a dashboard-v* tag is pushed. Not on every push/PR: a three-platform Tauri
# build is slow and only matters for a release. The Python suite runs on every
# push and PR in testes.yml.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "dashboard-v*"

# tauri-action's "Build and publish release draft" step creates a GitHub
# Release using secrets.GITHUB_TOKEN (tagName/releaseDraft below). Many orgs
# now default the auto-generated GITHUB_TOKEN to read-only (Settings > Actions
# > General > Workflow permissions), which would make that step fail with a
# 403 on the very first tag push, silently (from this file's point of view —
# the failure only surfaces at run time in the Actions log, not here) unless
# permissions are declared explicitly. Declared at the workflow level since
# the one job here is the only consumer.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkit2gtk, etc.)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm install

      # Tag push (dashboard-v*): build via tauri-action and publish a draft
      # GitHub Release with the bundled installers attached.
      - name: Build and publish release draft
        if: startsWith(github.ref, 'refs/tags/dashboard-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          tagName: ${{ github.ref_name }}
          releaseName: "delegation-core Dashboard ${{ github.ref_name }}"
          releaseBody: |
            Automated build of the delegation-core Tauri dashboard.
            Unsigned build — macOS Gatekeeper and Windows SmartScreen will warn
            on first launch. See install.sh / install.bat / install.command.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Manual workflow_dispatch run: just build and upload as a workflow
      # artifact, no release/tag involved.
      - name: Build only
        if: github.event_name == 'workflow_dispatch'
        working-directory: dashboard
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.platform }}
          path: |
            dashboard/src-tauri/target/release/bundle/**/*.deb
            dashboard/src-tauri/target/release/bundle/**/*.rpm
            dashboard/src-tauri/target/release/bundle/**/*.AppImage
            dashboard/src-tauri/target/release/bundle/**/*.msi
            dashboard/src-tauri/target/release/bundle/**/*.exe
            dashboard/src-tauri/target/release/bundle/**/*.dmg
            dashboard/src-tauri/target/release/bundle/**/*.app
          if-no-files-found: ignore
